name: Deploy

# Builds the site into an image and rolls it out to Cloud Run, at
# https://docs.pocketmoney.global. The GCP side, including the rule that only
# pushes and dispatches on main may deploy, is
# infrastructure/environments/public-docs in my-pocket-money/pocket. Same
# workflow as docket's.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The newest push holds every earlier change, so it replaces a deploy in flight.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: pm-public-docs
  REGION: us-west1
  IMAGE: us-west1-docker.pkg.dev/pm-public-docs/public-docs/public-docs:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Pinned to commits: this job can deploy to the public site.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deployer@pm-public-docs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: gcloud run services update public-docs --image "$IMAGE" --region "$REGION" --project "$PROJECT"
