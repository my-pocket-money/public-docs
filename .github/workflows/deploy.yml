name: Deploy

# Builds the site into an image and rolls it out to Cloud Run, at
# https://docs.pocketmoney.global. The GCP side, including the rule that only
# pushes and dispatches on main may deploy, is
# infrastructure/environments/public-docs in my-pocket-money/pocket. Same
# workflow as docket's.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The newest push holds every earlier change, so it replaces a deploy in flight.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: pm-public-docs
  REGION: us-west1
  IMAGE: us-west1-docker.pkg.dev/pm-public-docs/public-docs/public-docs:${{ github.sha }}

jobs:
  # The repository has no site yet. Until it has a package.json, a push says so
  # instead of failing the deploy. Remove this job once the site lands.
  site:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: check
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No package.json yet, so there is no site to deploy."
          fi

  deploy:
    needs: site
    # GCP accepts only main's runs anyway; this skips a dispatch from another
    # branch instead of failing it at sign-in.
    if: needs.site.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Actions are pinned to commits: this job can deploy to the public site.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built before signing in to GCP: auth writes a credentials file into the
      # checkout, which `docker build .` would otherwise send into the image.
      - name: Build
        run: docker build --tag "$IMAGE" .

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deployer@pm-public-docs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - name: Deploy
        run: gcloud run services update public-docs --image "$IMAGE" --region "$REGION" --project "$PROJECT"
