server {
    # Cloud Run's default port.
    listen 8080;
    root /usr/share/nginx/html;

    # Keep redirects such as /relay to /relay/ relative. An absolute one
    # would carry nginx's own http scheme and port 8080, which the browser
    # never used.
    absolute_redirect off;

    # nginx's mime.types doesn't know YAML. Serve the OpenAPI document as text
    # so browsers show it rather than download an unknown type.
    location ~ \.ya?ml$ {
        types { }
        default_type "application/yaml; charset=utf-8";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Scalar's bundle carries its version in its name, so it never changes.
    # A location's add_header replaces the server's, so repeat those here.
    location /scalar/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
}
