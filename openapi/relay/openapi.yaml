            - forbidden
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientNotFoundDetails:
      type: object
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - not_found
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientAddNotFoundDetails:
      type: object
