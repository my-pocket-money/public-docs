  /v1/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: |
        **Required scope:** `transactions:read`.

        List money-movement activity for the authenticated Customer. Recipient Customers' private
        activity is never included.

        Narrow results with `account_id`, `kind`, `method`, `status`, amount, reference, created
        date, or settled date.

        When supplied, `account_id` must identify an Account owned by the authenticated Customer.

        An Account filter identifying a nonexistent or unowned Account returns the same privacy-preserving
        `404`, with outer `code: not_found` and `details.code: not_found`.
        A malformed Account ID returns `400`. A valid owned Account with no
        matching activity returns an empty page.

        Results are ordered by `(created_at, id, account_id)`. Use `order=asc` for
        oldest first or `order=desc` (the default) for newest first. Page size
        defaults to 25 and may be 1–100. Retain the filters and order when following
        `next_cursor`.

        Each item is a transaction (`txn_…`) seen by the authenticated Customer:

        - Each `(id, account_id)` view appears at most once. An Account transfer has two views.
        - Use `kind` and `id` to fetch a transfer or deposit object when one exists.

        An accepted internal transfer creates the source and destination Account views at once:

        - The source entry is `kind=transfer` and starts `pending`.
        - The destination entry is `kind=deposit` and starts `pending`.
        - Both become `settled`, `failed`, or `voided` together. Each Customer can read only
          its owned Account views; a same-Customer transfer has two such views.

        A rejected transfer request creates no activity entry.

        The current response exposes common movement fields, not method-specific
        `details`, FX pricing, payment purpose codes or bank retrieval references.
        Read a transaction to retrieve its current status.

        If you sent money to a customer, your feed shows your transfer and its status, not
        the customer's resulting balance or unrelated activity. The feed excludes verification
        microdeposits, declined card authorizations, and Pocket-internal treasury operations.

      operationId: listTransactions
      x-required-scopes:
        - transactions:read
      parameters:
        - $ref: '#/components/parameters/AccountIdFilter'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/TransactionKind'
          description: Only transfers (outbound) or only deposits (inbound).
        - $ref: '#/components/parameters/MethodFilter'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - $ref: '#/components/parameters/AmountMin'
        - $ref: '#/components/parameters/AmountMax'
        - $ref: '#/components/parameters/ReferenceFilter'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
        - $ref: '#/components/parameters/SettledAfter'
        - $ref: '#/components/parameters/SettledBefore'
        - $ref: '#/components/parameters/CreatedOrder'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/transactions/{transaction_id}:
    get:
      tags:
        - Transactions
      summary: Retrieve a transaction
      description: |
        **Required scope:** `transactions:read`.

        Fetch one transaction entry by ID, e.g. `/v1/transactions/txn_…`.

        The endpoint returns the authenticated Customer's view. A transaction that is not visible
        to that Customer returns `404`.

        A same-Customer Account transfer has two owned views. Supply `account_id`
        to select one; omitting it when multiple views exist returns `400` with
        `details.param: account_id`. An Account that the transaction does not touch,
        or that the caller does not own, returns `404`, not an empty page.
      operationId: getTransaction
      x-required-scopes:
        - transactions:read
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: txn_01jjftqbz0n1vzey0pqrq3qmnn
        - $ref: '#/components/parameters/TransactionAccountViewpoint'
      responses:
        '200':
          description: The transaction entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/transfers:
    get:
      tags:
        - Transfers
      summary: List transfers
      description: |
        **Required scope:** `transfers:read`.

        Outbound money movements from the authenticated Customer.

        - The list includes every method that produces a transfer object.
        - Card activity is feed-only. See Transactions.

        Narrow results with `method`, `source_account_id`, `destination_id`, `status`, amount,
        reference, created date, or settled date.

        When supplied, `source_account_id` must identify an owned Account.

        `destination_id` may identify another owned Account, a Pocket Customer or
        an external instrument visible on a transfer. An Account filter identifying a nonexistent or unowned Account
        returns `404`. An unmatched Customer or instrument filter returns an
        empty page, without revealing whether the counterparty exists. Historical
        activity without an instrument ID is not matched by that instrument filter.

        Results are ordered by creation time and Transfer ID. Use `order` to return the oldest or
        newest Transfers first.

        Transfer reads expose supported historical outbound activity; they do not
        enable ACH, wire, onchain or IBFT creation through Relay. Only internal
        transfer creation is implemented in this release.
      operationId: listTransfers
      x-required-scopes:
        - transfers:read
      parameters:
        - $ref: '#/components/parameters/TransferMethodFilter'
        - $ref: '#/components/parameters/SourceAccountId'
        - $ref: '#/components/parameters/DestinationId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
        - $ref: '#/components/parameters/AmountMin'
        - $ref: '#/components/parameters/AmountMax'
        - $ref: '#/components/parameters/ReferenceFilter'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
        - $ref: '#/components/parameters/SettledAfter'
        - $ref: '#/components/parameters/SettledBefore'
        - $ref: '#/components/parameters/CreatedOrder'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transfers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/transfers/internal:
    post:
      tags:
        - Transfers
      summary: Create an internal transfer
      description: |
        **Required scope:** `transfers:write`.

        Move funds from the authenticated Customer's default Account (`source.customer_id`) or an
        exact owned Account (`source.account_id`) either to another Customer
        (`destination.customer_id`) or another Account owned by the same Customer
        (`destination.account_id`). A Customer destination receives into its immutable default
        Account. The counterparty Customer's private balance and activity remain hidden.

        Supply exactly one source and one destination selector. A Customer source
        must identify the authenticated Customer. A Customer destination must be
        another Customer, not a Recipient relationship ID. An Account destination
        must be owned by the authenticated Customer and differ from the resolved
        source Account. Selecting another Customer's Account directly is not supported.

        Individuals and businesses can use this operation. Customer-to-Customer
        transfers may have 30-day sending limits. Transfers between your own Accounts
        are not subject to these limits.

        **Idempotency:** The `Idempotency-Key` HTTP header is required for both
        Account-to-Account and Customer-to-Customer P2P transfers. Keys are scoped
        to the authenticated Customer and executing transfer operation, not to the
        API-key credential. Account transfers and P2P share one operation scope.
        Matching input includes the requested source and
        destination, normalized amount, currency, reference and memo. Decimal-equivalent
        amounts such as `"1"`, `"1.0"` and `"1.00"` match. Reusing an unexpired idempotency key for
        different input within that operation returns `409`. A default-Customer
        source selector and an explicit Account selector remain different input,
        even if they currently resolve to the same Account.

        For the default 24-hour window, an unchanged retry returns the saved initial
        `201 Created` Transfer response and original `Location`. Replay preserves
        the saved Account routing, status, reference, memo and timestamps even if
        the Transfer later settles, fails or is voided. It does not move money again
        or reload the Transfer's current state. Use `GET /v1/transfers/{transfer_id}`
        for current state. Authentication and authorization apply to every attempt.

        Concurrent requests with the same key and input wait for the first attempt
        to commit successfully, then replay its response. Being in flight alone
        does not produce an idempotency conflict. Retries do not extend the window;
        at or after 24-hour expiry, reusing the key can create another transfer.
        Keep one key and unchanged body for one payment intent. Use a new key for
        a different intent, including changing between Account-transfer and P2P
        destinations.

        **At acceptance**

        `201 Created` confirms acceptance, not settlement.

        - Source: `kind` is `transfer`, `method` is `internal`, and `status` is `pending`.
        - Destination: `kind` is `deposit`, `method` is `internal`, and `status` is `pending`.
        - Each Customer can immediately read its own Account views; an owned-Account
          transfer gives the same Customer both views.
        - Source `available` decreases and `reserved` increases.

        **At settlement**

        Both views become `settled`. The source reservation posts out. Pocket credits the destination
        `settled` and `available` amounts.

        **On failure or voiding**

        Both views remain visible with the terminal status. Pocket releases the source reservation
        and never credits the destination.

        If the API rejects a request before it creates a `txn_…`, it produces no transfer, deposit,
        or transaction resource.

        A credential without permission to send returns `403 forbidden`. A
        destination Customer without a payable default Account returns
        `403 recipient_not_payable`, without revealing private setup details.
        A missing or unowned source Account returns `404`, as does a missing or
        unowned destination Account on an owned-Account transfer.

        A P2P request that exceeds the source Customer's 30-day sending limit returns
        `429`, with outer `code: resource_exhausted` and `details.code: rate_limited`.
        It creates no transfer, deposit or transaction. This is a rejected request,
        not the `limit_exceeded` failure code on a Batch item.

        If a response is lost, retry the original key and request while the key is
        live. Once expired, reconcile known transaction IDs and references before
        deciding whether to send again. A reference is not unique and does not
        prevent another transfer.
      operationId: createInternalTransfer
      x-required-scopes:
        - transfers:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Required, case-sensitive request key. Supply exactly one nonblank value
            containing at most 255 Unicode code points, encoded as valid UTF-8 with
            no NUL character. Missing, empty, blank, invalid or repeated header values
            return `400` with `details.param` set to `Idempotency-Key`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
          example: d9f80740-7f8e-4f16-b5cc-4fd5bf7d3b21
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalTransferRequest'
            examples:
              customerTransfer:
                summary: Send to another Pocket Customer
                value:
                  source: {account_id: acc_01j8ma3wv3mepwabfxxs0yc395}
                  destination: {customer_id: cus_01jm0defbbct46vh2ev5dkkhej}
                  amount: '100.00'
                  currency: USD
                  reference: payrun-2026-07
                  memo: July salary
              accountTransfer:
                summary: Move money between owned Accounts
                value:
                  source: {account_id: acc_01j8ma3wv3mepwabfxxs0yc395}
                  destination: {account_id: acc_01j8mb3wv3mepwabfxxs0yc396}
                  amount: '100.00'
                  currency: USD
                  reference: payroll-funding-1042
      responses:
        '201':
          description: The created Transfer, or the saved initial Transfer response on an unchanged retry within 24 hours. Replay preserves the original 201 status, Location and Transfer body, even after settlement, failure or voiding.
          headers:
            Location:
              description: Relative API path of the created transfer. A matching retry returns the original Location value.
              schema:
                type: string
                format: uri-reference
                pattern: ^/v1/transfers/txn_
                example: /v1/transfers/txn_01k0d2f6h8j4m7n9p3q5r1s0vw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientFunds'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The request conflicts with Account state or a live idempotency key.
            Changed key reuse within the same transfer operation returns outer
            `code: aborted`, `details.code: idempotency_conflict` and
            `details.param: Idempotency-Key`, without `details.existing_id`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                code: aborted
                message: The idempotency key is bound to a different transfer request.
                details:
                  code: idempotency_conflict
                  param: Idempotency-Key
                  request_id: req_01jj0m9w2k3n5p7q9r1s3t5v7w
        '429':
          description: |
            The request exceeded an applicable limit, including the source
            Customer's rolling P2P send limit. The outer code is
            `resource_exhausted` and `details.code` is `rate_limited`.
            No transfer is created. Follow `Retry-After` when present.
          headers:
            Retry-After:
              description: Optional number of seconds to wait before retrying.
              schema: {type: integer, minimum: 0}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                code: resource_exhausted
                message: Transfer limit exceeded.
                details:
                  code: rate_limited
                  request_id: req_01jj0m9w2k3n5p7q9r1s3t5v7w
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/transfers/{transfer_id}:
    get:
      tags:
        - Transfers
      summary: Retrieve a transfer
      description: |
        **Required scope:** `transfers:read`.

        Fetch one transfer by ID, e.g. `/v1/transfers/txn_…`.

        This endpoint returns the outbound side when its source Customer is the authenticated
        Customer. Otherwise it returns `404`.

        For an internal movement, the same `txn_…` may also be retrievable from
        `GET /v1/deposits/{deposit_id}` by the destination Customer. The transfer is retrievable as
        soon as its `txn_…` exists and remains
        retrievable through its terminal status.

        When both Accounts belong to this Customer, the Transfer and Deposit
        endpoints select the outbound and inbound views respectively without an
        additional Account query parameter. Card activity has no Transfer resource.
      operationId: getTransfer
      x-required-scopes:
        - transfers:read
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: txn_01k0d2f6h8j4m7n9p3q5r1s0vw
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/deposits:
    get:
      tags:
        - Deposits
      summary: List deposits
      description: |
        **Required scope:** `deposits:read`.

        Inbound money movements into Accounts owned by the authenticated Customer.

        - The list includes every method that produces a deposit object.
        - Card refunds are feed-only. See Transactions.
        - Deposits are read-only: you never create one.

        Narrow results with `method`, `account_id`, `status`, amount, reference,
        created date, or settled date.

        An internal transfer appears in the destination Customer's results as soon as its `txn_…`
        identifier exists.

        For an internal movement:

        - The deposit appears immediately as `pending`.
        - It does not affect destination balances until settlement.
        - A later failure or void leaves the deposit visible with that terminal status.

        When supplied, `account_id` must identify an Account owned by the authenticated
        Customer. An Account filter identifying a nonexistent or unowned Account returns `404`.

        Results are ordered by creation time and Deposit ID. Use `order` to return the oldest or
        newest Deposits first.
      operationId: listDeposits
      x-required-scopes:
        - deposits:read
      parameters:
        - $ref: '#/components/parameters/DepositMethodFilter'
        - $ref: '#/components/parameters/AccountIdFilter'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - $ref: '#/components/parameters/AmountMin'
        - $ref: '#/components/parameters/AmountMax'
        - $ref: '#/components/parameters/ReferenceFilter'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
        - $ref: '#/components/parameters/SettledAfter'
        - $ref: '#/components/parameters/SettledBefore'
        - $ref: '#/components/parameters/CreatedOrder'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deposits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/deposits/{deposit_id}:
    get:
      tags:
        - Deposits
      summary: Retrieve a deposit
      description: |
        **Required scope:** `deposits:read`.

        Fetch one deposit by ID, e.g. `/v1/deposits/txn_…`.

        This endpoint returns the inbound side when its destination Customer is the authenticated
        Customer. Otherwise it returns `404`.

        For an internal movement:

        - The same `txn_…` may resolve at `GET /v1/transfers/{transfer_id}` for the source Customer.
        - The deposit is retrievable immediately after transaction creation, including while
          `pending`.
        - It remains retrievable after becoming `failed` or `voided`.
        - For a transfer between two of this Customer's Accounts, this endpoint
          selects the inbound view and the Transfer endpoint selects the outbound view.
      operationId: getDeposit
      x-required-scopes:
        - deposits:read
      parameters:
        - name: deposit_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: txn_01jjftqbz0n1vzey0pqrq3qmnn
      responses:
        '200':
          description: The deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/batches:
    post:
      tags:
        - Batch Transfers
      summary: Create a batch of transfers
      description: |
        **Required scopes:** `batches:write` and `transfers:write`.

        **Customer eligibility:** authenticated `business` Customer only.

        Submit internal transfers from the authenticated business Customer's default Account
        (`source.customer_id`) or an exact owned Account (`source.account_id`) asynchronously.
        Acceptance does not move or reserve money. An ineligible source returns `403`, and the API
        creates no batch.

        Batch items currently support only `USD`, funded from the selected USD
        Account. Another currency returns `400 invalid_request` with
        `param=items[n].currency`, where `n` is the zero-based item index.
        Items accept destination Customer IDs, not Account or Recipient IDs.

        - Each item checks available balance only when it runs.
        - Item processing order is not guaranteed.

        **Recipient policy pre-check**

        `recipient_policy` defaults to `any_customer`. Set it to `recipients_only` to check the
        complete batch against the authenticated Customer's recipient list before acceptance:

        - The authenticated Customer must have a linked Recipient whose `customer_id` equals every
          `destination.customer_id`.
        - Every matched recipient must currently have `capabilities.can_receive_transfers` set to
          `true`.
        - Pocket must also confirm that each destination can receive the payment.
          `can_receive_transfers: true` does not guarantee that the recipient can receive this payment.

        This check runs after ordinary validation, including duplicate `item_id` validation. If any
        item fails, one `400 recipient_policy_failed` response lists all failures in request order.
        A rejected first attempt creates no Batch and saves no key binding. Resolve
        the reported policy failures before resubmitting; a new key is not required.

        The roster policy is not repeated during item processing. Ordinary transfer
        rules, including available funds, send limits and payability, still apply.
        With `any_customer`, destination eligibility and payability are checked
        when each item first executes rather than by this acceptance pre-check.

        Track every submitted line with `GET /v1/batches/{batch_id}/items`.

        - A failure before transaction creation has `transfer_id: null`.
        - Once the item is linked to a `txn_…`, `transfer_id` identifies it through
          settlement, failure or voiding. An item awaiting a confirmed payment
          result can also have `transfer_id: null`.
        - Insufficient funds at execution produces `failure_code: insufficient_funds`.
        - Check failed items before submitting a replacement Batch. A missing
          Transfer ID does not confirm that no payment started. Reusing an
          `item_id` in another Batch can pay the recipient again.

        **Duplicate item ids**

        Every `item_id` must be unique within `items`.

        - Comparison is exact and case-sensitive.
        - Pocket does not trim, case-fold, or normalize the value.
        - Other line fields do not affect duplicate detection.
        - `reference` and the `Idempotency-Key` header do not identify batch lines.

        Pocket reports the first repeated value. The request returns `400 invalid_request`, with
        `param` set to the second occurrence (`items[n].item_id`). The index is zero-based.

        A rejected first attempt creates no Batch and saves no key binding. Correct
        the duplicate item ID and resubmit; this validation error does not require a new key.

        You cannot cancel a batch after acceptance.

        **Idempotency:** The `Idempotency-Key` header is required. Keys are scoped
        to the authenticated Customer and Batch-create operation. Matching input
        includes the requested source, recipient policy, ordered items, reference
        and metadata. The first successful response is saved atomically with the
        Batch, items and execution messages. An unchanged retry within 24 hours
        returns that original `202 Accepted` body and `Location`, not current
        counts or payment state. It does not enqueue the items again or recheck
        Recipient policy. Caller authorization still applies on replay.

        Concurrent matching retries wait for the first commit. Changed input
        returns `409` with outer `aborted`, `details.code: idempotency_conflict`
        and `details.param: Idempotency-Key`, without `existing_id`. Expired keys
        can create another Batch. Use the saved Batch ID to retrieve an ambiguous
        older request, or list by reference and creation time, then reconcile its
        items and source activity. References are not unique. Do not submit a
        replacement merely because the acceptance response or Transfer link is missing.

        Pocket retries each batch payment using the same idempotency key. If its
        outcome remains unknown after 24 hours, Pocket stops automatic retries to
        avoid duplicate payments. Check uncertain payment outcomes before submitting
        a replacement Batch. An `item_id` identifies a payment within one Batch;
        reusing it in a new Batch can pay the recipient again.
      operationId: createBatch
      x-business-only: true
      x-required-scopes:
        - batches:write
        - transfers:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Required, case-sensitive request key. Supply exactly one nonblank value
            containing at most 255 Unicode code points, encoded as valid UTF-8 with
            no NUL character. Missing, blank, repeated or invalid keys return `400`
            with `details.param` set to `Idempotency-Key`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '202':
          description: |
            Batch accepted. Acceptance does not reserve funds or guarantee that any item will
            settle. A matching retry returns the saved initial acceptance, including its
            original counts and timestamps. Use GET for current execution progress.
          headers:
            Location:
              description: Relative API path of the created batch.
              schema:
                type: string
                format: uri-reference
                pattern: ^/v1/batches/batch_
                example: /v1/batches/batch_01j5gr81vpavng9emxaepf2be3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BatchBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The key is bound to different Batch input within 24 hours. Returns `aborted`,
            `details.code: idempotency_conflict` and `details.param: Idempotency-Key`, without `existing_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeaderIdempotencyConflict'
        default:
          $ref: '#/components/responses/DefaultError'
    get:
      tags:
        - Batch Transfers
      summary: List batches
      description: |
        **Required scope:** `batches:read`.

        **Customer eligibility:** authenticated `business` Customer only.

        List batches submitted by the authenticated Customer.

        `source_account_id` filters only this Customer's Batches. A syntactically
        valid Account ID with no matching visible Batches returns an empty page,
        without disclosing whether that Account exists or who owns it.

        Results use `(created_at, id)`, newest first by default; `order=asc`
        selects oldest first. Filters apply before pagination. A cursor binds
        Customer, Account/status/reference/time filters and order, not limit.
        Repeat the same filters on continuation; limit may change (default 25,
        range 1–100). Empty scalar queries are treated as omitted. Date bounds
        are inclusive and `created_after` must not be later than `created_before`.
        Results are current views, not a frozen multi-page snapshot.
      operationId: listBatches
      x-business-only: true
      x-required-scopes:
        - batches:read
      parameters:
        - $ref: '#/components/parameters/BatchSourceAccountId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchStatus'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
        - $ref: '#/components/parameters/BatchReferenceFilter'
        - $ref: '#/components/parameters/CreatedOrder'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/batches/{batch_id}:
    get:
      tags:
        - Batch Transfers
      summary: Retrieve a batch
      description: |
        **Required scope:** `batches:read`.

        **Customer eligibility:** authenticated `business` Customer only.

        Retrieve a Batch by ID. Use its current item counts and amount totals to
        track progress; this is not the saved initial POST response. A missing
        or unowned Batch returns `404`; a malformed Batch ID returns `400` with
        `details.param: batch_id`.
      operationId: getBatch
      x-business-only: true
      x-required-scopes:
        - batches:read
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^batch_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: batch_01j5gr81vpavng9emxaepf2be3
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/batches/{batch_id}/items:
    get:
      tags:
        - Batch Transfers
      summary: List a batch's items
      description: |
        **Required scope:** `batches:read`.

        **Customer eligibility:** authenticated `business` Customer only.

        List every submitted item in the batch, including items that failed before creating a
        transfer.

        Use `item_id` to reconcile the response with the line you submitted. When an item creates
        a linked Transfer, `transfer_id` identifies the resulting `txn_…`.
        Items awaiting a confirmed payment result also have `transfer_id: null`; that value alone is
        not proof of a known failure or that no payment started. Available
        failure details are in `failure_code` and `failure_message`; these fields
        are present as null for healthy and voided items.

        For retries and payments with an unknown outcome, see
        [Batch Transfers](#tag/batch-transfers).

        Narrow with `item_id`, `status`, or `reference`.

        Reconcile uncertain or `internal_error` outcomes against source activity
        before submitting a replacement. A new Batch can create new Transfers.
        `item_id` does not deduplicate across Batches, so resubmitting a settled
        or ambiguous line can pay the same Customer twice.

        The API orders results by `(created_at ASC, item_id ASC)`.
        Filters apply before pagination. A cursor binds Customer, Batch and
        item/status/reference filters, not limit (default 25, range 1–100).
        Repeat the filters with the cursor. A traversal is not a frozen snapshot;
        restart it to observe items that changed status. Empty scalar query
        values are treated as omitted.
      operationId: listBatchItems
      x-business-only: true
      x-required-scopes:
        - batches:read
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^batch_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
        - $ref: '#/components/parameters/BatchItemIdFilter'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchItemStatus'
        - $ref: '#/components/parameters/BatchReferenceFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the batch's items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/batches/{batch_id}/transfers:
    get:
      tags:
        - Batch Transfers
      summary: List a batch's transfers
      description: |
        **Required scopes:** `batches:read` and `transfers:read`.

        **Customer eligibility:** authenticated `business` Customer only.

        Only items that produced a transfer appear here. Every submitted item appears in
        `GET /v1/batches/{batch_id}/items`. An item that fails before transfer creation, such as for
        insufficient funds when it runs, has `transfer_id: null`. The API orders results by
        `(created_at ASC, id ASC)`.
        A cursor binds Customer, Batch and status, not limit (default 25,
        range 1–100). Repeat the status filter with the cursor; filtering precedes
        pagination. Empty scalar query values are treated as omitted.

        This list contains only linked, visible Transfer views from the pinned
        source Account. If a payment's outcome is unknown, check the Batch items
        and source Account activity before submitting it again.
      operationId: listBatchTransfers
      x-business-only: true
      x-required-scopes:
        - batches:read
        - transfers:read
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^batch_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the batch's transfers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key associated with one Customer, sent as a bearer token. The authenticated Customer may be an `individual` or a `business`. Within its capability scopes, the key applies to that Customer and resources it owns.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 8192
      description: Opaque cursor (`next_cursor` from a prior page). Re-supply the same filters. A mismatch or invalid cursor returns 400.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CreatedOrder:
      name: order
      in: query
      description: Sort by creation time. `desc` returns newest first; `asc` returns oldest first. IDs break ties in the same direction.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    AccountIdPath:
      name: account_id
      in: path
      required: true
      description: An Account owned by the authenticated Customer.
      schema:
        type: string
        pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
      example: acc_01j8ma3wv3mepwabfxxs0yc395
    BusinessCustomerIdPath:
      name: business_customer_id
      in: path
      required: true
      description: The authenticated business Customer whose recipient roster the API manages. An individual Customer returns `403`. Another Customer returns `404`.
      schema:
        type: string
        pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
      example: cus_01j8ma3wv3mepwabfxxs0yc395
    RecipientIdPath:
      name: recipient_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^rcp_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
      description: The Recipient (`rcp_…`) owned by this business Customer.
      example: rcp_01k2p7m4sd6t8v0x3y5z9a1bcf
    CreatedAfter:
      name: created_after
      in: query
      description: Only items created at/after this time (inclusive).
      schema:
        type: string
        format: date-time
        description: RFC 3339 / ISO 8601 instant. Any offset accepted (e.g. `Z` or `+05:00`).
        example: '2026-07-31T09:00:00Z'
    CreatedBefore:
      name: created_before
      in: query
      description: Only items created at/before this time (inclusive).
      schema:
        type: string
        format: date-time
        description: RFC 3339 / ISO 8601 instant. Any offset accepted (e.g. `Z` or `+05:00`).
        example: '2026-07-31T09:00:00Z'
    SettledAfter:
      name: settled_after
      in: query
      description: Only items settled at/after this time (inclusive). This filter excludes pending, failed, and voided items because they have no settlement time.
      schema:
        type: string
        format: date-time
        description: RFC 3339 / ISO 8601 instant. Any offset accepted (e.g. `Z` or `+05:00`).
        example: '2026-07-31T09:00:00Z'
    SettledBefore:
      name: settled_before
      in: query
      description: Only items settled at/before this time (inclusive). This filter excludes pending, failed, and voided items because they have no settlement time.
      schema:
        type: string
        format: date-time
        description: RFC 3339 / ISO 8601 instant. Any offset accepted (e.g. `Z` or `+05:00`).
        example: '2026-07-31T09:00:00Z'
    AmountMin:
      name: amount_min
      in: query
      description: Minimum amount (inclusive), as a decimal string in major units, e.g. `100.00`.
      schema:
        $ref: '#/components/schemas/MoneyAmount'
    AmountMax:
      name: amount_max
      in: query
      description: Maximum amount (inclusive), as a decimal string in major units, e.g. `100.00`.
      schema:
        $ref: '#/components/schemas/MoneyAmount'
    DestinationId:
      name: destination_id
      in: query
      description: |
        Filter by an owned Account, a Pocket Customer, or an external instrument already
        visible on a matching transfer.

        - Malformed or wrong-prefix value: `400`. `param` is `destination_id`.
        - An Account that does not exist or belongs to another Customer returns `404`.
        - An owned Account with no matching visible transfers returns an empty page.
        - A Customer or instrument with no matching visible transfers returns an empty
          page, without disclosing whether that counterparty exists.
      schema:
        type: string
        pattern: ^(?:acc_|cus_|epi_)[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
    BatchItemIdFilter:
      name: item_id
      in: query
      description: Only the batch item with this caller-supplied ID. Unique within the batch.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
    BatchSourceAccountId:
      name: source_account_id
      in: query
      description: |
        Filter this Customer's Batches by exact source Account ID. A malformed
        or zero ID returns `400` with `param=source_account_id`. A valid ID with
        no matching visible Batches returns an empty page, without disclosing
        Account existence or ownership.
      schema:
        type: string
        pattern: '^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
        not:
          enum: [acc_00000000000000000000000000]
    BatchReferenceFilter:
      name: reference
      in: query
      description: |
        Exact, case-sensitive reference filter. References are not unique;
        matches are paginated. Whitespace is retained; an empty query value is
        treated as omitted.
      schema:
        type: string
        maxLength: 255
        pattern: '^[^\x00]*$'
    TransactionAccountViewpoint:
      name: account_id
      in: query
      description: |
        Select one owned Account's viewpoint of this transaction.

        - If exactly one owned Account view exists, omit this parameter or supply that Account ID.
        - If several owned Account views exist, supply `account_id`. Without it, the request
          returns `400` with `param=account_id`.
        - A malformed or wrong-prefix value returns `400`. `param` is `account_id`.
        - An unowned Account, or one the transaction does not touch, returns `404`.
      schema: {type: string, pattern: '^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'}
      example: acc_01j8ma3wv3mepwabfxxs0yc395
    MethodFilter:
      name: method
      in: query
      description: Filter transactions by method. Repeat the parameter to match more than one (e.g. `method=ach&method=wire`).
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Method'
      example:
        - ach
        - wire
    TransferMethodFilter:
      name: method
      in: query
      description: |
        Filter transfers by method. Repeat the parameter to match more than one (e.g.
        `method=ach&method=wire`). A method that cannot produce a Transfer returns `400`
        `invalid_request` with `param=method` rather than an empty result.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransferMethod'
      example:
        - ach
        - wire
    DepositMethodFilter:
      name: method
      in: query
      description: |
        Filter deposits by method. Repeat the parameter to match more than one (e.g.
        `method=ach&method=wire`). A method that cannot produce a Deposit returns `400`
        `invalid_request` with `param=method` rather than an empty result.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DepositMethod'
      example:
        - ach
        - wire
    ReferenceFilter:
      name: reference
      in: query
      description: |
        Exact match on your opaque `reference` for the object. Not unique. May
        match more than one object, and results are paginated. Values are not
        trimmed or case-folded. An empty value means no filter. Maximum 255
        Unicode characters; NUL is invalid.
      schema:
        type: string
        maxLength: 255
        pattern: ^[^\x00]*$
    SourceAccountId:
      name: source_account_id
      in: query
      description: Filter by an Account owned by the authenticated Customer. An Account that does not exist or belongs to another Customer returns privacy-preserving `404`.
      schema:
        type: string
        pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
    AccountIdFilter:
      name: account_id
      in: query
      description: |
        Filter an activity list to an Account owned by the authenticated Customer.

        - Malformed or wrong-prefix value: `400`. `param` is `account_id`.
        - No matching activity for an owned Account returns an empty page.
        - Both the Deposit and Transaction lists return the same privacy-preserving
          `404` for a missing or unowned Account.
      schema:
        type: string
        pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
      example: acc_01j8ma3wv3mepwabfxxs0yc395
  schemas:
    MoneyAmount:
      type: string
      maxLength: 19
      pattern: ^(?:0(?:\.[0-9]{1,2})?|[1-9][0-9]{0,15}(?:\.[0-9]{1,2})?)$
      description: A non-negative decimal string in major units. For example, `"100.00"` means 100 USD. USD supports 1–16 integer digits and up to two fractional digits.
      example: '100.00'
    WriteAmount:
      type: string
      pattern: "^[\\t\\n\\v\\f\\r \u0085\u00a0\u1680\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u2028\u2029\u202f\u205f\u3000]*(?:\\$[\\t\\n\\v\\f\\r \u0085\u00a0\u1680\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u2028\u2029\u202f\u205f\u3000]*)?(?:0\\.(?:0[1-9]|[1-9][0-9]?)|(?:[1-9][0-9]{0,15}|[1-9][0-9]{0,2}(?:,[0-9]{3}){1,4}|[1-9](?:,[0-9]{3}){5})(?:\\.[0-9]{1,2})?)[\\t\\n\\v\\f\\r \u0085\u00a0\u1680\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u2028\u2029\u202f\u205f\u3000]*$"
      description: |
        A positive USD amount to move, expressed as a JSON string in major units. For example,
        `"100.00"` means 100 USD; `"$ 1,234.56"` means 1234.56 USD.

        - The value must be greater than zero.
        - USD supports 1–16 integer digits and at most two fractional digits.
        - The maximum value is `"9999999999999999.99"`.
        - Surrounding whitespace is ignored. A single leading `$` is optional; whitespace
          between it and the amount is also ignored.
        - Commas may separate groups of three integer digits, such as `"1,234.56"` or
          `"1,234,567"`. Malformed grouping such as `"12,34"` is invalid.
        - Signs, other currency symbols, whitespace within the number, scientific notation,
          leading-dot forms, trailing-dot forms and unnecessary leading zeros are invalid.
        - For Batch idempotency, equivalent forms such as `"1234"`, `"1,234.00"`, and
          `" $ 1,234.00 "` are treated as the same amount.

        An invalid, non-positive or overflowing amount returns `400 invalid_request`. `param` names
        the request field, such as `amount`, `source_amount` or `items[n].amount`. The request
        creates or changes nothing. Other Customer and rail limits may impose a lower maximum.
      example: '100.00'
    Currency:
      type: string
      enum:
        - USD
      x-extensible-enum:
        - USD
      description: |
        Public settlement currency debited from or credited to a Customer balance.

        - `USD` is the only value emitted in V1.
        - Clients must preserve and tolerate future values.
        - Cross-currency payouts may define separate destination-currency and foreign exchange
          (FX) fields.
      example: USD
    Metadata:
      type: object
      description: |
        Up to 50 caller-defined string key/value pairs. An empty object is valid.

        **Keys**

        - 1–64 Unicode characters.
        - Compared exactly as supplied.
        - Not trimmed, case-folded, or Unicode-normalized.
        - Any Unicode character except NUL (`U+0000`).

        OpenAPI 3.0 cannot express the key-length limit for arbitrary properties, so Pocket enforces
        it at runtime. An invalid key returns `400 invalid_request` with `param=metadata`. The key is
        not echoed.

        **Values**

        - String values only.
        - Empty values are allowed.
        - Maximum 256 Unicode characters.
        - NUL (`U+0000`) is not allowed.
        - Preserved exactly as supplied, without trimming or Unicode normalization.

        An overlong value returns `400 invalid_request`. `param` is `metadata.<key>` when the key is
        valid, or `metadata` when the key is invalid. The value is never echoed.

        **Privacy**

        The API shows metadata only in the Customer view where the caller set it. The API
        does not share metadata with money-movement counterparties. Use it for opaque business
        identifiers and non-sensitive labels only.

        Do not include:

        - Government identity values.
        - Bank-account, routing, or payment-card details.
        - Passwords, secrets, access tokens, or credentials.
        - KYC documents.
        - Biometric or health information.
        - Names, email addresses, or phone numbers when a dedicated field exists.

        Pocket may reject metadata that appears sensitive, but the caller remains responsible for
        the data it supplies.
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 256
        pattern: ^[^\x00]*$
    ListMeta:
      type: object
      required:
        - has_more
        - next_cursor
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
    AccountMetadata:
      type: object
      description: |
        Private string metadata for an Account. At most 50 entries. Keys must be
        nonempty and at most 64 Unicode characters; values may be empty and at
        most 256 Unicode characters. Neither keys nor values may contain NUL.
        Values are preserved without trimming, case-folding or normalization.

        Account validation reports `400 invalid_request` with `param: metadata`
        for an invalid key or value. Use opaque business identifiers and
        non-sensitive labels, not credentials or personal financial information.
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 256
        pattern: ^[^\x00]*$
    CreateAccountRequest:
      type: object
      additionalProperties: false
      description: |
        Presentation fields for a new Account. All fields are optional; `{}`
        creates an Account without a label, reference or metadata. Supply the
        required request key in the `Idempotency-Key` HTTP header. Fields may not
        be null. Text is preserved exactly, including empty strings; NUL is invalid.
        A supplied label is unique within the Customer, including an empty label.
        A reference is not unique. Omitted metadata and `{}` have the same meaning.
      properties:
        label: {type: string, maxLength: 255, pattern: '^[^\x00]*$', description: 'Customer-scoped unique label, compared exactly as supplied.'}
        reference: {type: string, maxLength: 255, pattern: '^[^\x00]*$', description: 'Private, non-unique reference.'}
        metadata: {$ref: '#/components/schemas/AccountMetadata'}
      example:
        label: Payroll
        reference: payroll-1042
        metadata: {}
    Account:
      type: object
      additionalProperties: false
      required: [id, currency, is_default, label, reference, metadata, created_at, updated_at]
      description: |
        A directly addressable USD funds container owned by the authenticated
        Customer. More than one Account can use the same currency. Ownership,
        currency and default selection cannot be changed through
        this API. Label, reference and metadata are mutable presentation fields.
      properties:
        id: {type: string, pattern: '^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$', example: acc_01j8ma3wv3mepwabfxxs0yc395}
        currency: {$ref: '#/components/schemas/Currency'}
        is_default: {type: boolean, readOnly: true, description: 'Whether Customer-addressed internal transfers use this immutable default Account.'}
        label: {type: string, nullable: true, maxLength: 255, pattern: '^[^\x00]*$', description: 'Customer-scoped unique label when non-null, including the empty string.'}
        reference: {type: string, nullable: true, maxLength: 255, pattern: '^[^\x00]*$', description: 'Private, non-unique reference.'}
        metadata: {$ref: '#/components/schemas/AccountMetadata'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      description: |
        Supply at least one presentation field. Omitted fields are unchanged.
        `null` clears label or reference; metadata must be an object and replaces
        the complete map (`{}` clears it). Non-null labels are unique within the
        Customer, including the empty string. Text is compared and stored exactly;
        NUL is invalid. References are not unique.
      anyOf:
        - required: [label]
        - required: [reference]
        - required: [metadata]
      properties:
        label: {type: string, nullable: true, maxLength: 255, pattern: '^[^\x00]*$'}
        reference: {type: string, nullable: true, maxLength: 255, pattern: '^[^\x00]*$'}
        metadata: {$ref: '#/components/schemas/AccountMetadata'}
    AccountList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [data]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Account'}}
    RecipientAssociationStatus:
      type: string
      enum:
        - linked
        - pending
        - unavailable
      description: |
        Coarse association state for this business-owned recipient relationship.

        - `linked`: every supplied identifier resolved to one Customer. `customer_id` is non-null.
        - `pending`: a pre-existing unresolved Recipient with `customer_id: null`.
          Reads may link it when its retained identifiers resolve to one eligible
          Customer. Public Recipient creation does not create this state.
        - `unavailable`: the Recipient can no longer complete or use its association.

        Association status does not expose a private Customer eligibility reason.
    RecipientStatus:
      type: string
      enum:
        - active
        - inactive
        - removed
      description: |
        The business-owned recipient relationship state.

        - `active`: the business considers the recipient active. Check
          `capabilities.can_receive_transfers` before payment.
        - `inactive`: the business has marked the recipient inactive.
        - `removed`: the business has removed the recipient. Use DELETE to enter this state.
          Unfiltered lists hide removed recipients. You can still retrieve them directly or list
          them with `status=removed`.

        Changing this status never changes the target Customer or payment history.
    RecipientWritableStatus:
      type: string
      enum:
        - active
        - inactive
      description: |
        The recipient relationship states a business may request. Setting `active` changes only the business-owned recipient record and cannot bypass private Customer eligibility.
    RecipientCapabilities:
      type: object
      additionalProperties: false
      required:
        - can_receive_transfers
      properties:
        can_receive_transfers:
          type: boolean
          description: |
            Whether the roster relationship is active and linked to an active,
            unblocked Customer. A pending, inactive, removed, or unavailable
            Recipient returns `false`, without exposing a private reason.

            This value describes Recipient eligibility. Payment checks also consider
            the receiving Account, source balance, amount, currency, limits and risk.
            A value of `true` does not guarantee that a payment will succeed.
            A replayed write returns the saved capability, not its current value;
            use GET for current roster state.
    RecipientCustomerIdLookup:
      type: string
      pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
      description: Match by the customer's exact Pocket ID (`cus_…`). This value is not normalized.
    RecipientPaytagLookup:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
      description: |
        Match by exact paytag after trimming surrounding whitespace, removing at
        most one leading `@`, and lowercasing. The input limit is 32 code points
        before normalization. The canonical value must be 1–30 ASCII letters,
        digits or underscores, contain a letter, and not start or end with an
        underscore. Reserved paytags are invalid.
    RecipientEmailLookup:
      type: string
      format: email
      maxLength: 254
      pattern: '^[^\x00]*$'
      description: |
        Match a stored Customer email after trimming surrounding whitespace and
        lowercasing it. A syntactically valid mailbox address is required; display
        names are not accepted. This sensitive lookup input is not returned on
        the Recipient and does not provide verification evidence in the response.
    RecipientPhoneLookup:
      type: string
      pattern: ^\+[1-9][0-9]{1,14}$
      description: |
        Match a stored Customer phone using E.164 form (for example, `+61412345678`).
        The number must also pass phone-number validation; permitted Sandbox
        test numbers are the environment-specific exception.
        This sensitive lookup input is not returned on the Recipient and does not
        provide verification evidence in the response.
    CreateRecipientRequest:
      type: object
      additionalProperties: false
      description: |
        Create a business-owned Recipient resource. Supply at least one of `customer_id`, `paytag`,
        `email`, or `phone`. More than one is permitted, but every supplied identifier must
        resolve uniquely to the same Customer.

        An unknown explicit `customer_id`, conflicting identifiers, ambiguous identifier
        data, blocked relationships, unavailable Customers, and incomplete matches return the same
        privacy-preserving `404 recipient_not_found` without identifying the failed input. The
        operation creates nothing unless the supplied identifiers resolve to an existing,
        active, unblocked Customer other than the authenticated business Customer.
        Pending Recipient creation and Customer onboarding are not supported here.

        The request requires an `Idempotency-Key` HTTP header and a business-supplied display label. Existing
        non-removed Recipients return `200` without overwriting their business-owned fields.
        Re-adding a removed Recipient restores it using the supplied label, reference, and
        metadata.

        Raw email and phone inputs are sensitive. They are not included in the Recipient response.
        A Recipient grants no access to a linked Customer or its instruments.
      required:
        - label
      anyOf:
        - type: object
          title: With Customer ID
          required:
            - customer_id
        - type: object
          title: With paytag
          required:
            - paytag
        - type: object
          title: With email
          required:
            - email
        - type: object
          title: With phone
          required:
            - phone
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[^\x00]*\S[^\x00]*$
          description: Business-supplied nonblank display label. The length limit is checked before surrounding whitespace is trimmed.
        customer_id:
          $ref: '#/components/schemas/RecipientCustomerIdLookup'
        paytag:
          $ref: '#/components/schemas/RecipientPaytagLookup'
        email:
          $ref: '#/components/schemas/RecipientEmailLookup'
        phone:
          $ref: '#/components/schemas/RecipientPhoneLookup'
        reference:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[^\x00]*$
          description: Optional business-owned reconciliation reference. Omitted and null are equivalent; an empty string is preserved and is distinct from null.
        metadata:
          $ref: '#/components/schemas/Metadata'
      example:
        label: Taylor Reed
        customer_id: cus_01jm0defbbct46vh2ev5dkkhej
        reference: EMP-1042
        metadata:
          department: Operations
    UpdateRecipientRequest:
      type: object
      additionalProperties: false
      description: |
        Replace only this business's mutable recipient relationship state. Supply all of `label`,
        `reference`, `status`, and `metadata`. `reference` is required but may be null.
        Supply the optional request key in the `Idempotency-Key` HTTP header.

        `metadata` replaces the whole object; use an empty object to clear it. The replacement
        never changes the target Customer, destination `customer_id`, lookup identifiers,
        association evidence, or private Customer eligibility.
      required:
        - label
        - reference
        - status
        - metadata
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[^\x00]*\S[^\x00]*$
          description: Business-supplied nonblank display label. The length limit is checked before surrounding whitespace is trimmed.
        reference:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[^\x00]*$
          description: Set to null to clear.
        status:
          $ref: '#/components/schemas/RecipientWritableStatus'
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          description: Whole-object replacement; use an empty object to clear.
      example:
        label: Taylor Reed
        reference: EMP-1042
        status: inactive
        metadata:
          department: Operations
    Recipient:
      type: object
      additionalProperties: false
      required:
        - id
        - customer_id
        - label
        - reference
        - association_status
        - status
        - capabilities
        - metadata
        - created_at
        - updated_at
      description: |
        A business-owned roster resource. Use its `id` (`rcp_…`) to retrieve, update, or remove the
        Recipient. This ID is never a payment destination.

        A linked Recipient's `customer_id` is the destination identifier for Transfers and
        Batches. A pending Recipient has `customer_id: null` and cannot receive transfers.

        This object is not a target Customer view or a copy of its private matching criteria. It
        contains no Pocket profile name, paytag, email, phone, government identity, onboarding/KYC
        state, capability reason, balances, or instruments.
      properties:
        id:
          type: string
          pattern: ^rcp_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: Stable ID for managing this Recipient resource. Never use it as a payment destination.
          example: rcp_01k2p7m4sd6t8v0x3y5z9a1bcf
        customer_id:
          type: string
          pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          nullable: true
          description: |
            Linked Customer destination for Transfers and Batches. Null while `association_status=pending`.
          example: cus_01jm0defbbct46vh2ev5dkkhej
        label:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[^\x00]*$
          description: Business-supplied display label.
          example: Taylor Reed
        reference:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[^\x00]*$
          description: Optional business-owned reconciliation reference.
          example: EMP-1042
        association_status:
          $ref: '#/components/schemas/RecipientAssociationStatus'
        status:
          $ref: '#/components/schemas/RecipientStatus'
        capabilities:
          $ref: '#/components/schemas/RecipientCapabilities'
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
      example:
        id: rcp_01k2p7m4sd6t8v0x3y5z9a1bcf
        customer_id: cus_01jm0defbbct46vh2ev5dkkhej
        label: Taylor Reed
        reference: EMP-1042
        association_status: linked
        status: active
        capabilities:
          can_receive_transfers: true
        metadata:
          department: Operations
        created_at: '2026-07-31T09:05:00Z'
        updated_at: '2026-07-31T09:05:00Z'
    RecipientList:
      type: object
      additionalProperties: false
      required:
        - data
        - has_more
        - next_cursor
      description: |
        One cursor page. `data` is always an array, including when empty. When `has_more` is false,
        `next_cursor` is null; otherwise it is the opaque cursor for the next page.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null on the final page.
    CustomerReference:
      type: object
      required:
        - customer_id
      additionalProperties: false
      description: A Pocket customer reference. A destination may be an `individual` or a `business` unless the operation says otherwise. Using a customer as a transfer destination does not grant read or administrative access to it.
      properties:
        customer_id:
          type: string
          pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: A Pocket customer.
          example: cus_01jm0defbbct46vh2ev5dkkhej
    AccountReference:
      type: object
      required: [account_id]
      additionalProperties: false
      description: An Account owned by the authenticated Customer.
      properties:
        account_id: {type: string, pattern: '^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$', example: acc_01j8ma3wv3mepwabfxxs0yc395}
    AccountSource:
      description: |
        The Account that funds an internal Transfer or Batch. Supply exactly one:

        - `customer_id` must identify the authenticated Customer and selects its default Account.
        - `account_id` selects that exact Account and must be owned by the authenticated Customer.
      oneOf:
        - $ref: '#/components/schemas/CustomerReference'
        - $ref: '#/components/schemas/AccountReference'
    TransferSource:
      description: |
        The Account whose available balance funds the transfer. It must be owned by the
        authenticated Customer and its currency must match the request.
      allOf:
        - $ref: '#/components/schemas/AccountReference'
    TransferDestination:
      type: object
      nullable: true
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: |
        Where a transfer sends money:

        - A Pocket Customer, using `customer_id`, for P2P `internal`.
        - Another owned Account, using `account_id`, for a same-Customer Account transfer.
        - An external instrument, using `instrument_id`, when that ID was recorded
          on supported historical outbound activity.

        Transfers created by the implemented internal-transfer endpoint have a
        non-null Customer or owned-Account destination. Historical activity may
        return `destination: null` when no resource ID is available. The API does
        not synthesize an instrument ID or expose method-specific address, asset
        or network details. These read shapes do not enable external-rail creation.
      properties:
        account_id:
          type: string
          pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: Another Account owned by the authenticated Customer.
        customer_id:
          type: string
          pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: A Pocket Customer destination for an internal transfer.
          example: cus_01jm0defbbct46vh2ev5dkkhej
        instrument_id:
          type: string
          pattern: ^epi_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: An external instrument registered to the source Customer.
          example: epi_01jzjc7rmr2k988mgd9nrk1r1b
    TransactionSideReference:
      type: object
      nullable: true
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: |
        A reference to one side of a money-movement entry.

        A non-null value contains exactly one field:

        - `account_id` for an owned Account.
        - `customer_id` for a Pocket Customer counterparty.
        - `instrument_id` for an external instrument.

        An empty object is invalid. JSON `null` means this side has no Pocket resource visible to
        the caller, such as the external sender of a deposit, an unregistered counterparty on
        historical onchain activity. When no resource ID is available, the API does
        not synthesize one. Method-specific details are not exposed in this release.
      properties:
        account_id:
          type: string
          pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: An Account on this side of the movement.
          example: acc_01j8ma3wv3mepwabfxxs0yc395
        customer_id:
          type: string
          pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: The Pocket customer on this side of the money movement.
          example: cus_01j8ma3wv3mepwabfxxs0yc395
        instrument_id:
          type: string
          pattern: ^epi_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: The external instrument on this side of the money movement (`epi_…`).
          example: epi_01jzjc7rmr2k988mgd9nrk1r1b
    Method:
      type: string
      description: |
        How the money traveled. Adding a method requires a specification and client update.
        These values classify visible activity; they do not enable creation on
        those rails. Only internal transfer creation is implemented in this release.

        - `internal`: Pocket-to-Pocket book movement.
        - `ach` and `wire`: inbound bank payments and outbound payouts.
        - `onchain`: outbound stablecoin transfers and inbound stablecoin deposits.
        - `ibft`: outbound USD-to-PKR payout over Inter Bank Funds Transfer.
        - `swift`, `faster_payments`, and `payment_link`: inbound methods in V1.
        - `card`: feed-only card activity. A spend is a transfer. A refund is a deposit.
      enum:
        - internal
        - ach
        - wire
        - onchain
        - ibft
        - swift
        - faster_payments
        - payment_link
        - card
    TransferMethod:
      type: string
      description: The enum lists accepted method values for Transfer reads and filters, not available creation endpoints. Only internal transfer creation is implemented. Card spends are feed-only and do not have Transfer objects.
      enum:
        - internal
        - ach
        - wire
        - onchain
        - ibft
      example: ach
    DepositMethod:
      type: string
      description: The enum lists method values for Deposit objects. Card refunds are feed-only and do not have Deposit objects.
      enum:
        - internal
        - ach
        - wire
        - onchain
        - swift
        - faster_payments
        - payment_link
      example: ach
    TransactionKind:
      type: string
      description: '`transfer` is outbound from this Account; `deposit` is inbound to it. Direction does not imply settlement: pending, failed and voided movements have not posted a settled debit or credit.'
      enum:
        - transfer
        - deposit
      example: deposit
    TransferStatus:
      type: string
      description: '`pending` (accepted, not yet settled), `settled` (posted to the balance), `failed`, or `voided`. Pocket assigns `voided` to an accepted transfer that will not settle. There is no public cancel or void endpoint.'
      enum:
        - pending
        - settled
        - failed
        - voided
    BatchStatus:
      type: string
      description: |
        Summary status derived from the batch item counts:

        - `pending`: `item_counts.pending == item_counts.total`. Items may already
          have started executing; this does not mean no payment has begun.
        - `processing`: `0 < item_counts.pending < item_counts.total`.
        - `completed`: `item_counts.settled == item_counts.total`; no failed or voided items.
        - `partially_completed`: `item_counts.pending == 0` and some, but not all, items settled.
        - `failed`: terminal with zero settled items. Items may be `failed` or `voided`.

        Counts describe recorded item states, not independent proof of payment
        outcomes. Reconcile an uncertain `internal_error` against linked Transfers
        and source activity before sending a replacement payment. Counts satisfy
        `item_counts.pending + item_counts.settled + item_counts.failed + item_counts.voided == item_counts.total`.
      enum:
        - pending
        - processing
        - completed
        - partially_completed
        - failed
    BatchItemStatus:
      type: string
      description: Lifecycle of one submitted Batch item. A linked Transfer's state is projected asynchronously onto its item. Pocket assigns `voided` to an item that will not settle and is not a failure. Healthy and voided items emit `failure_code` and `failure_message` as JSON null, not omitted fields.
      enum:
        - pending
        - settled
        - failed
        - voided
    TransactionStatus:
      type: string
      description: '`pending` (accepted, not yet settled), `settled` (posted to the balance), `failed`, or `voided`. Pocket assigns `voided`. It does not mean that the caller canceled the transaction.'
      enum:
        - pending
        - settled
        - failed
        - voided
    TransferStatusTimestamps:
      type: object
      required: [pending, settled, failed, voided]
      description: When the transfer entered each status (RFC 3339 / ISO 8601, UTC). Null until entered.
      properties:
        pending:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-31T09:00:00Z'
        settled:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-31T09:00:00Z'
        failed:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-31T09:00:00Z'
        voided:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-31T09:00:00Z'
    CreateInternalTransferRequest:
      type: object
      required:
        - source
        - destination
        - amount
        - currency
      additionalProperties: false
      description: |
        Send to another Pocket Customer or another owned Account. Supply the
        required request key in the `Idempotency-Key` HTTP header. Both destination
        types share one operation scope and replay the saved initial response for
        24 hours, subject to authentication, authorization and validation.
        Optional text fields may be empty
        but not null, must be valid UTF-8 and may not contain NUL.
      properties:
        source:
          $ref: '#/components/schemas/AccountSource'
        destination:
          $ref: '#/components/schemas/InternalTransferDestination'
        amount:
          $ref: '#/components/schemas/WriteAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
          maxLength: 255
          pattern: ^[^\x00]*$
          description: Your private external reference for this transfer (e.g. a pay-run or employee ID). Optional, not unique. Filter by it. Counterparties do not see it.
          example: payrun-2026-07
        memo:
          type: string
          maxLength: 100
          pattern: ^[^\x00]*$
          description: Payment note carried on the movement and visible to the destination customer when the method supports a note. Internal transfer memos can be up to 100 characters. The API rejects longer values with `400` (`param` is `memo`) and never truncates them.
          example: July salary
      example:
        source:
          account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        destination:
          customer_id: cus_01jm0defbbct46vh2ev5dkkhej
        amount: '100.00'
        currency: USD
        reference: payrun-2026-07
        memo: July salary
    Transfer:
      type: object
      required:
        - id
        - method
        - reference
        - memo
        - source
        - destination
        - amount
        - currency
        - status
        - batch_id
        - transitioned_at
        - created_at
        - updated_at
      description: |
        An outbound money movement. `method` says how it traveled. Fetch it at
        `GET /v1/transfers/{id}`. An internal transfer appears as `pending` when accepted and stays
        visible through its terminal status.

        `amount` and `currency` describe the outbound USD movement for the source
        Account. For historical external-rail activity, they do not describe an
        original foreign-currency or stablecoin amount, or provide a fee breakdown.
        The response does not expose method-specific details, FX pricing, payment
        purpose codes or bank retrieval references.

        `destination` may be null when historical activity has no recorded resource
        ID. Use `status` and `transitioned_at` to observe the lifecycle.
      properties:
        id:
          type: string
          pattern: ^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: txn_01k0d2f6h8j4m7n9p3q5r1s0vw
        method:
          $ref: '#/components/schemas/TransferMethod'
        reference:
          type: string
          nullable: true
          description: The API caller's private external reference. It is never exposed to another Customer.
          example: payrun-2026-07
        memo:
          type: string
          nullable: true
          description: Payment note carried on the movement, when set.
          example: July salary
        source:
          $ref: '#/components/schemas/TransferSource'
        destination:
          $ref: '#/components/schemas/TransferDestination'
        batch_id:
          type: string
          pattern: ^batch_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          nullable: true
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/TransferStatus'
        failure_code:
          allOf:
            - $ref: '#/components/schemas/TransferFailureCode'
          description: Machine-readable failure reason, included when available.
        failure_message:
          type: string
          description: Failure explanation, included when available.
        transitioned_at:
          $ref: '#/components/schemas/TransferStatusTimestamps'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
      example:
        id: txn_01k0d2f6h8j4m7n9p3q5r1s0vw
        method: internal
        reference: payrun-2026-07
        memo: July salary
        source:
          account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        destination:
          customer_id: cus_01jm0defbbct46vh2ev5dkkhej
        batch_id: null
        amount: '100.00'
        currency: USD
        status: pending
        transitioned_at:
          pending: '2026-07-31T11:00:00Z'
          settled: null
          failed: null
          voided: null
        created_at: '2026-07-31T11:00:00Z'
        updated_at: '2026-07-31T11:00:00Z'
    TransferList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Transfer'
    Deposit:
      type: object
      required:
        - id
        - method
        - source
        - destination
        - account_id
        - reference
        - memo
        - amount
        - currency
        - status
        - created_at
        - settled_at
        - updated_at
      description: |
        An inbound money movement into `account_id`. `method` says how it traveled. Clients never
        create deposits.

        Deposits include incoming bank or supported stablecoin payments and the destination side
        of an internal transfer.

        Internal deposits use `method=internal`. Card refunds appear only in the transaction feed.
        Fetch a deposit at `GET /v1/deposits/{id}`.

        `destination.account_id` always equals the top-level `account_id`.

        For an internal movement:

        - The deposit appears immediately as `pending`.
        - It does not affect the destination balance until settlement.
        - It settles with the source view.
        - If it does not settle, it remains visible as `failed` or `voided`.

        `amount` is the inbound USD movement for this Account. The response does
        not expose method-specific details, the original foreign-currency or
        stablecoin amount, or a fee breakdown. A pending Deposit affects the
        destination balance only when it settles.
      properties:
        id:
          type: string
          pattern: ^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: txn_01jjftqbz0n1vzey0pqrq3qmnn
        method:
          $ref: '#/components/schemas/DepositMethod'
        account_id:
          type: string
          pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: The Account the money arrived to. Always the same Account as `destination.account_id`.
          example: acc_01j8ma3wv3mepwabfxxs0yc395
        source:
          $ref: '#/components/schemas/TransactionSideReference'
        destination:
          allOf:
            - $ref: '#/components/schemas/AccountReference'
          description: The Account the money arrived to. Always the same Account as `account_id`.
        reference:
          type: string
          nullable: true
          description: Another Customer's private reference is never exposed. An internal transfer between this Customer's own Accounts preserves the reference in both views.
        memo:
          type: string
          nullable: true
          description: Payment note carried on the movement, when set.
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
        settled_at:
          type: string
          format: date-time
          nullable: true
          description: When the deposit settled. Null while pending. RFC 3339 / ISO 8601, UTC.
          example: '2026-07-31T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: When the deposit resource last changed. RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
      example:
        id: txn_01jjftqbz0n1vzey0pqrq3qmnn
        method: ach
        account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        source: null
        destination:
          account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        reference: null
        memo: null
        amount: '2500.00'
        currency: USD
        status: settled
        created_at: '2026-07-30T14:10:00Z'
        settled_at: '2026-07-31T09:00:00Z'
        updated_at: '2026-07-31T09:00:00Z'
    DepositList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Deposit'
    Transaction:
      type: object
      required:
        - id
        - account_id
        - kind
        - method
        - source
        - destination
        - amount
        - currency
        - status
        - reference
        - memo
        - created_at
        - settled_at
      description: |
        One transaction (`txn_…`) as seen from `account_id`. `kind` identifies
        outbound or inbound direction, not settlement. `method` identifies the rail.

        Each Account sees at most one view of a transaction. A same-Customer Account transfer
        produces two views with the same Transaction ID.

        For an internal movement:

        - Source and destination views both start `pending`.
        - Both remain visible through the same terminal status.
        - `pending` does not mean the movement posted to that Customer's balance.

        Use `kind` and `id` to fetch a transfer or deposit object when one exists. Card entries are
        feed-only.

        The feed includes accepted movements in `pending`, `failed` and `voided` states. It excludes
        verification microdeposits, declined card authorizations and Pocket treasury operations.

        `amount` and `currency` describe this Account's USD movement. The response
        does not expose method-specific details, original foreign-currency or
        stablecoin amounts, fees, FX pricing, payment purpose codes or bank retrieval
        references. A historical counterparty can be null when no resource ID is
        recorded. A method in the feed does not imply a Relay creation endpoint.
      properties:
        id:
          type: string
          pattern: ^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: txn_01jjftqbz0n1vzey0pqrq3qmnn
        account_id:
          type: string
          pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          description: The Account whose view this entry represents.
          example: acc_01j8ma3wv3mepwabfxxs0yc395
        kind:
          $ref: '#/components/schemas/TransactionKind'
        method:
          $ref: '#/components/schemas/Method'
        source:
          $ref: '#/components/schemas/TransactionSideReference'
        destination:
          $ref: '#/components/schemas/TransactionSideReference'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        reference:
          type: string
          nullable: true
          description: The external reference visible to this Customer. Another Customer's value is never exposed. Filterable via `reference` only where visible.
        memo:
          type: string
          nullable: true
          description: Payment note carried on the movement, when set.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
        settled_at:
          type: string
          format: date-time
          nullable: true
          description: When the entry settled (posted to the balance). Null while pending. RFC 3339 / ISO 8601, UTC.
          example: '2026-07-31T09:00:00Z'
      example:
        id: txn_01jjftqbz0n1vzey0pqrq3qmnn
        account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        kind: deposit
        method: ach
        source: null
        destination:
          account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        amount: '2500.00'
        currency: USD
        status: settled
        reference: null
        memo: null
        created_at: '2026-07-30T14:10:00Z'
        settled_at: '2026-07-31T09:00:00Z'
    TransactionList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
    BatchRecipientPolicy:
      type: string
      enum:
        - any_customer
        - recipients_only
      default: any_customer
      description: |
        One-time destination pre-check applied before Pocket accepts a batch.

        - `any_customer`: skip the acceptance-time recipient pre-check. Each
          destination is another Pocket Customer whose eligibility and Money
          payability are checked when its item first executes.
        - `recipients_only`: every destination must meet all these conditions:
          - The authenticated Customer has a linked Recipient whose `customer_id` equals this
            destination.
          - Its current `capabilities.can_receive_transfers` value is `true`.
          - Pocket also confirms that the destination can receive the payment.
            `can_receive_transfers: true` does not guarantee that the recipient can receive this payment.

        The roster policy is not evaluated again after acceptance or as individual
        Transfers execute. Ordinary funds, limit and payability rules still apply.
        Omitting the field and sending `any_customer` are equivalent for Batch
        idempotency. Explicit null is invalid.
    BatchMetadata:
      type: object
      nullable: false
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 255
        pattern: '^[^\x00]*$'
      description: |
        Batch and Batch-item metadata: up to 50 string key/value pairs. Keys
        contain 1–64 Unicode code points and values 0–255. Both must be valid
        UTF-8 without NUL and are preserved exactly without trimming or case
        normalization. Key-length limits are enforced at runtime.

        Omit request metadata to use `{}`; explicit null is invalid. Responses
        always include an object. Invalid keys identify `metadata` and invalid
        values identify `metadata.<key>`; item fields use the `items[n].` prefix.
        Use opaque business identifiers, not personal data, payment details or secrets.
    BatchAggregateAmount:
      type: string
      maxLength: 23
      pattern: '^(?:0(?:\.[0-9]{1,2})?|[1-9][0-9]{0,19}(?:\.[0-9]{1,2})?)$'
      description: |
        Non-negative sum of Batch-item amounts in major units, with at most
        two fractional digits. An aggregate can exceed a single payment's
        16-integer-digit limit: up to 4,096 submitted payments can total
        `40959999999999999959.04`. This does not increase the per-payment limit
        or guarantee sufficient funds or execution.
      example: '220.00'
    BatchItemFailureCode:
      type: string
      nullable: true
      description: |
        Null for pending, settled and voided items. Known failure values are
        `insufficient_funds`, `recipient_not_payable`, `limit_exceeded` and
        `internal_error`. Private payability reasons are not exposed. Preserve
        unknown future values. An internal failure or missing Transfer link is
        not proof that no payment started; reconcile before resubmitting.
    BatchTransferItem:
      type: object
      additionalProperties: false
      required:
        - item_id
        - destination
        - amount
        - currency
      properties:
        item_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
          description: Your non-blank ID for this line, unique by exact, case-sensitive equality across the entire submitted batch. Pocket does not trim, case-fold, or otherwise normalize it. Returned by List a batch's items so you can reconcile every submitted line.
        destination:
          $ref: '#/components/schemas/CustomerReference'
        amount:
          $ref: '#/components/schemas/WriteAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
          nullable: false
          maxLength: 255
          pattern: '^[^\x00]*$'
          description: An opaque reference for this line (e.g. an employee ID). Optional, non-null and not unique. Empty strings are normalized to absent; responses emit null. Filter by a nonempty reference.
        memo:
          type: string
          nullable: false
          maxLength: 100
          pattern: '^[^\x00]*$'
          description: Optional non-null memo carried on the underlying internal Transfer. Maximum 100 Unicode code points; longer input returns `400` with `details.param=items[n].memo` and is never truncated. Empty strings are normalized to absent; responses emit null.
        metadata:
          $ref: '#/components/schemas/BatchMetadata'
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - items
      description: |
        Create a Batch of USD internal Transfers funded by the authenticated
        Customer's default Account or an exact owned Account. Each destination
        must be another Customer, not an Account or Recipient ID. Response
        amount totals remain grouped by currency.

        `recipient_policy` is optional and defaults to `any_customer`. Optional
        policy, reference and metadata fields cannot be null. The same rule
        applies to each item's optional reference, memo and metadata. Empty
        reference/memo strings are equivalent to omission for idempotency and
        become null in responses. Metadata defaults to an empty object.
      properties:
        source:
          $ref: '#/components/schemas/AccountSource'
        recipient_policy:
          $ref: '#/components/schemas/BatchRecipientPolicy'
        items:
          type: array
          minItems: 1
          maxItems: 4096
          description: |
            Each `item_id` must be unique in the array. Pocket enforces this at runtime because
            OpenAPI 3.0 `uniqueItems` compares whole objects rather than one field.
          items:
            $ref: '#/components/schemas/BatchTransferItem'
        reference:
          type: string
          nullable: false
          maxLength: 255
          pattern: '^[^\x00]*$'
          description: Your external reference for this Batch (e.g. a pay-run ID). Optional, non-null, filterable and not unique. An empty string is normalized to absent and returned as null.
          example: northwind-payroll-2026-07
        metadata:
          $ref: '#/components/schemas/BatchMetadata'
      example:
        source:
          account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        recipient_policy: recipients_only
        items:
          - item_id: line-001
            destination:
              customer_id: cus_01jm0defbbct46vh2ev5dkkhej
            amount: '100.00'
            currency: USD
            reference: EMP-1042
          - item_id: line-002
            destination:
              customer_id: cus_01j7qkfn0n4egp6wj30vajew7g
            amount: '120.00'
            currency: USD
            reference: EMP-1089
        reference: northwind-payroll-2026-07
        metadata:
          pay_period: 2026-07
    BatchItem:
      type: object
      required:
        - item_id
        - batch_id
        - status
        - transfer_id
        - destination
        - amount
        - currency
        - reference
        - memo
        - failure_code
        - failure_message
        - metadata
        - created_at
        - updated_at
      description: |
        One submitted batch line. Pre-transaction failures also produce an item.

        - A pre-transaction failure has `transfer_id: null` and no money-movement resource.
        - After linking, `transfer_id` is the transaction's `txn_…` ID.
        - Items awaiting a confirmed payment result also have `transfer_id: null`;
          this alone does not prove a failure or that no payment started.
        - Authorized Customer views remain visible through later failure or voiding.
      properties:
        item_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
          description: The caller-supplied ID from the submitted batch item. Unique within the batch.
          example: line-001
        batch_id:
          type: string
          pattern: ^batch_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: batch_01j5gr81vpavng9emxaepf2be3
        status:
          $ref: '#/components/schemas/BatchItemStatus'
        transfer_id:
          type: string
          nullable: true
          pattern: '^txn_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
          description: The linked Transfer (`txn_…`), or null before linking and for failures without a linked Transfer. Null is not proof that an uncertain payment did nothing.
          example: txn_01jhv705whdehqd34b4113r1q8
        destination:
          $ref: '#/components/schemas/CustomerReference'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
          nullable: true
          maxLength: 255
          pattern: '^[^\x00]*$'
          description: Your private external reference for this batch item, when set.
        memo:
          type: string
          nullable: true
          maxLength: 100
          pattern: '^[^\x00]*$'
          description: Payment note carried on the resulting transfer, when set.
        failure_code:
          $ref: '#/components/schemas/BatchItemFailureCode'
        failure_message:
          type: string
          nullable: true
        metadata:
          $ref: '#/components/schemas/BatchMetadata'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
    BatchItemList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BatchItem'
    BatchItemCounts:
      type: object
      required:
        - total
        - pending
        - settled
        - failed
        - voided
      additionalProperties: false
      description: |
        Counts of submitted batch items by current item status. The status counts always satisfy
        `pending + settled + failed + voided == total`.
      properties:
        total:
          type: integer
          minimum: 1
          description: Total submitted items in the batch.
          example: 2
        pending:
          type: integer
          minimum: 0
          description: Items whose `status` is `pending`.
          example: 0
        settled:
          type: integer
          minimum: 0
          description: Items whose `status` is `settled`.
          example: 2
        failed:
          type: integer
          minimum: 0
          description: Items whose `status` is `failed`.
          example: 0
        voided:
          type: integer
          minimum: 0
          description: Items whose `status` is `voided`.
          example: 0
    BatchAmountTotals:
      type: object
      required:
        - currency
        - total
        - pending
        - settled
        - failed
        - voided
      additionalProperties: false
      description: |
        Amount totals by current item status for one currency. Amount status totals always satisfy
        `pending + settled + failed + voided == total`.
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          $ref: '#/components/schemas/BatchAggregateAmount'
        pending:
          $ref: '#/components/schemas/BatchAggregateAmount'
        settled:
          $ref: '#/components/schemas/BatchAggregateAmount'
        failed:
          $ref: '#/components/schemas/BatchAggregateAmount'
        voided:
          $ref: '#/components/schemas/BatchAggregateAmount'
    Batch:
      type: object
      required:
        - id
        - reference
        - source
        - recipient_policy
        - status
        - item_counts
        - amount_totals
        - metadata
        - created_at
        - finalized_at
      description: |
        A submitted batch of internal transfers. Acceptance does not reserve funds or guarantee
        settlement.

        - Every item checks available balance when it runs.
        - Item order is not guaranteed.
        - You cannot cancel an accepted batch.

        Counts reflect current item statuses and satisfy
        `item_counts.pending + item_counts.settled + item_counts.failed + item_counts.voided == item_counts.total`.
        The response groups amount totals by currency. For each entry in `amount_totals`,
        `pending + settled + failed + voided == total`.
      properties:
        id:
          type: string
          pattern: ^batch_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: batch_01j5gr81vpavng9emxaepf2be3
        reference:
          type: string
          nullable: true
          maxLength: 255
          pattern: '^[^\x00]*$'
          example: northwind-payroll-2026-07
        source:
          $ref: '#/components/schemas/TransferSource'
        recipient_policy:
          $ref: '#/components/schemas/BatchRecipientPolicy'
        status:
          $ref: '#/components/schemas/BatchStatus'
        item_counts:
          $ref: '#/components/schemas/BatchItemCounts'
        amount_totals:
          type: array
          minItems: 1
          description: Amount totals grouped by currency. There is one entry per currency present in the submitted items.
          items:
            $ref: '#/components/schemas/BatchAmountTotals'
        metadata:
          $ref: '#/components/schemas/BatchMetadata'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
        finalized_at:
          type: string
          format: date-time
          nullable: true
          description: When the batch reached a terminal status (`completed`, `partially_completed`, or `failed`). Null while pending or processing. RFC 3339 / ISO 8601 timestamp in UTC.
          example: '2026-07-31T09:00:00Z'
      example:
        id: batch_01j5gr81vpavng9emxaepf2be3
        reference: northwind-payroll-2026-07
        source:
          account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        recipient_policy: recipients_only
        status: pending
        item_counts:
          total: 2
          pending: 2
          settled: 0
          failed: 0
          voided: 0
        amount_totals:
          - currency: USD
            total: '220.00'
            pending: '220.00'
            settled: '0.00'
            failed: '0.00'
            voided: '0.00'
        metadata:
          pay_period: 2026-07
        created_at: '2026-07-31T10:00:00Z'
        finalized_at: null
    BatchList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Batch'
    Balance:
      type: object
      description: |
        The funds held by one Account. Multiple Accounts may use the same currency.
        An Account without ledger activity is present with zero amounts. Amounts
        are decimal strings; a fixed number of trailing zeroes is not guaranteed.
        `reserved` is the non-negative amount held for accepted outbound movements that have not
        settled. `available = settled - reserved`. Pending inbound movements do not affect any
        balance amount until they settle.
      required:
        - account_id
        - currency
        - reference
        - available
        - settled
        - reserved
        - as_of
      properties:
        account_id:
          type: string
          pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
          example: acc_01j8ma3wv3mepwabfxxs0yc395
        reference:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^[^\x00]*$
        currency:
          $ref: '#/components/schemas/Currency'
        available:
          $ref: '#/components/schemas/MoneyAmount'
        settled:
          $ref: '#/components/schemas/MoneyAmount'
        reserved:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          description: |
            Accepted outbound holds that have not settled. Reserved funds remain part of
            `settled`, but not `available`.
        as_of:
          type: string
          format: date-time
          description: The time this snapshot reflects (RFC 3339 / ISO 8601, UTC). Not a sync token.
          example: '2026-07-31T09:00:00Z'
      example:
        account_id: acc_01j8ma3wv3mepwabfxxs0yc395
        currency: USD
        reference: null
        available: '2500.00'
        settled: '2500.00'
        reserved: '0.00'
        as_of: '2026-07-31T09:15:00Z'
    BalanceList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Balance'
    ErrorCode:
      type: string
      description: Stable, machine-readable error code. Preserve unknown values and fall back to the HTTP status. See Errors for the current code catalog.
    TransferFailureCode:
      type: string
      description: |
        Rejected create requests use the HTTP error envelope; Batch items have
        their own `failure_code`. Preserve unknown string values.
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      description: |
        Pocket's error envelope. `code` identifies the HTTP error class and
        `details.code` gives the stable Pocket reason. Clients must also accept
        `details: null`, and maintenance details with `maintenance: true` and
        `retry_after_seconds` instead of a reason or request ID.
      properties:
        code:
          type: string
          description: Stable machine-readable classification that maps to the HTTP status.
          example: invalid_argument
        message:
          type: string
          description: Human-readable explanation. Do not branch on its wording.
          example: The request is invalid.
        details:
          anyOf:
            - $ref: '#/components/schemas/ErrorDetails'
            - $ref: '#/components/schemas/MaintenanceDetails'
    MaintenanceDetails:
      type: object
      additionalProperties: false
      required: [maintenance, retry_after_seconds]
      properties:
        maintenance:
          type: boolean
          enum: [true]
        retry_after_seconds:
          type: integer
          minimum: 0
          example: 60
    MaintenanceError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum: [unavailable]
            details:
              $ref: '#/components/schemas/MaintenanceDetails'
      example:
        code: unavailable
        message: Pocket is temporarily unavailable. Please try again shortly.
        details:
          maintenance: true
          retry_after_seconds: 60
    ErrorDetails:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        param:
          type: string
          description: The request field that caused the error, when applicable.
          example: destination.customer_id
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
          example: req_01jj0m9w2k3n5p7q9r1s3t5v7w
        existing_id:
          type: string
          description: Reserved optional field. Current V1 idempotency conflicts do not return an existing resource ID; save IDs from successful responses.
        failures:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            $ref: '#/components/schemas/BatchRecipientPolicyFailure'
    InvalidRequestError:
      $ref: '#/components/schemas/Error'
    RecipientErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      description: |
        The error envelope returned by Recipient operations. `code` determines the HTTP status;
        `details.code` is Pocket's stable public reason. A response can return `details: null` only
        where its specific schema permits it.
      properties:
        code:
          type: string
          description: Stable machine-readable classification that maps to the HTTP status.
        message:
          type: string
          description: Human-readable explanation. Do not branch on its wording.
        details:
          type: object
          nullable: true
          description: Typed Pocket error details, or null where the response permits it.
    RecipientInvalidRequestDetails:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - invalid_request
        param:
          type: string
          description: The request field that caused the error, when applicable.
          example: label
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientUnauthorizedDetails:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - unauthorized
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientForbiddenDetails:
