              $ref: '#/components/schemas/RecipientAddNotFoundDetails'
    HeaderIdempotencyConflict:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              enum:
                - aborted
            details:
              type: object
              additionalProperties: false
              required:
                - code
                - param
                - request_id
              properties:
                code:
                  type: string
                  enum:
                    - idempotency_conflict
                param:
                  type: string
                  enum:
                    - Idempotency-Key
                request_id:
                  type: string
                  minLength: 1
                  description: Quote this when contacting support.
    RecipientStateConflictError:
      allOf:
        - $ref: '#/components/schemas/RecipientErrorEnvelope'
        - type: object
          properties:
            code:
              type: string
              enum:
                - aborted
            details:
              $ref: '#/components/schemas/RecipientStateConflictDetails'
    RecipientRateLimitedError:
      allOf:
        - $ref: '#/components/schemas/RecipientErrorEnvelope'
        - type: object
          properties:
            code:
              type: string
              enum:
                - resource_exhausted
            details:
              $ref: '#/components/schemas/RecipientRateLimitedDetails'
    RecipientInternalError:
      allOf:
        - $ref: '#/components/schemas/RecipientErrorEnvelope'
        - type: object
          properties:
            code:
              type: string
              enum:
                - internal
            details:
              $ref: '#/components/schemas/RecipientInternalErrorDetails'
    RecipientServiceUnavailableError:
      allOf:
        - $ref: '#/components/schemas/RecipientErrorEnvelope'
        - type: object
          properties:
            code:
              type: string
              enum:
                - unavailable
            details:
              $ref: '#/components/schemas/RecipientServiceUnavailableDetails'
    BatchRecipientPolicyFailureCode:
      type: string
      description: |
        Why one batch item failed the `recipients_only` pre-check. Known values are:

        - `destination_not_a_recipient`: the destination failed roster eligibility.
          This covers missing/nonexistent destinations, inactive or removed
          Recipients, and inactive or blocked target Customers, without
          disclosing which condition applied.
        - `recipient_not_payable`: the Recipient is eligible, but the destination
          cannot receive this payment. This can occur even when
          `capabilities.can_receive_transfers` is true. The private reason is not disclosed.
        Additional values may appear. Clients must preserve unknown values and handle them as a
        generic recipient-policy failure.
    BatchRecipientPolicyFailure:
      type: object
      required:
        - item_id
        - param
        - code
      additionalProperties: false
      properties:
        item_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00]*[^\s\x00][^\x00]*$'
          description: The caller-supplied ID of the failing batch item.
          example: line-004
        param:
          type: string
          description: The failing destination field and its zero-based request index.
          example: items[3].destination.customer_id
        code:
          $ref: '#/components/schemas/BatchRecipientPolicyFailureCode'
    BatchRecipientPolicyError:
      allOf:
        - $ref: '#/components/schemas/Error'
      example:
        code: invalid_argument
        message: One or more batch destinations do not satisfy the recipient policy.
        details:
          code: recipient_policy_failed
          param: items
          request_id: req_01jj0m9w2k3n5p7q9r1s3t5v7w
          failures:
            - item_id: line-004
              param: items[3].destination.customer_id
              code: destination_not_a_recipient
            - item_id: line-009
              param: items[8].destination.customer_id
              code: recipient_not_payable
    InsufficientFundsError:
      allOf:
        - $ref: '#/components/schemas/Error'
      example:
        code: failed_precondition
        message: Source balance is short for this transfer.
        details:
          code: insufficient_funds
          request_id: req_01jj0m9w2k3n5p7q9r1s3t5v7w
    InternalTransferDestination:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: |
        Exactly one destination: another Customer's immutable default Account, or
        another Account owned by the authenticated Customer. A Customer destination
        must differ from the authenticated Customer. An Account destination must
        differ from the resolved source Account. Recipient relationship IDs and
        another Customer's explicit Account IDs are not supported.
      properties:
        customer_id:
          type: string
          pattern: ^cus_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
        account_id:
          type: string
          pattern: ^acc_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
  responses:
    DefaultError:
      description: |
        Standard error envelope for a response not listed separately on the operation. Any
        operation may return `400` for a malformed or wrong-prefix ID, as well as `401`, `403`,
        `429`, `500` or `503`. A listed response takes precedence. Maintenance
        uses `details.maintenance: true` and `details.retry_after_seconds`;
        it need not include `details.code` or `details.request_id`. See the
        [common HTTP status table](https://docs.pocketmoney.global/relay/#errors)
        for meanings and retry guidance.
      headers:
        Retry-After:
          description: Optional number of seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request. `details.code` is `invalid_request`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidRequestError'
    RecipientBadRequest:
      description: |
        Invalid Recipient request. The outer code is `invalid_argument`. Pocket validation
        supplies `details.code=invalid_request`; malformed requests can return `details: null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientBadRequestError'
          examples:
            validation:
              value:
                code: invalid_argument
                message: The request is invalid.
                details:
                  code: invalid_request
                  param: label
                  request_id: req_01jj0m9w2k3n5p7q9r1s3t5v7w
            malformed_request:
              value:
                code: invalid_argument
                message: invalid request body
                details: null
    RecipientUnauthorized:
      description: |
        Authentication is missing or invalid. The outer code is `unauthenticated`. When details
        are present, `details.code` is `unauthorized`; some authentication failures can return
        `details: null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientUnauthorizedError'
    RecipientForbidden:
      description: |
        The authenticated API key cannot use this Recipient operation. The outer code is
        `permission_denied` and `details.code` is `forbidden`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientForbiddenError'
    RecipientNotFound:
      description: |
        The owning Customer or Recipient does not exist or is not visible to the authenticated
        Customer. The outer code is `not_found` and `details.code` is `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientNotFoundError'
    RecipientAddNotFound:
      description: |
        Either the owning Customer is not visible (`details.code=not_found`), or the supplied
        identifiers could not safely identify a Recipient Customer
        (`details.code=recipient_not_found`). The latter covers an incomplete match, an unknown
        explicit Customer ID, conflicting matches, ambiguity, blocks, and unavailable targets
        without identifying which lookup failed. The outer code is `not_found` in both cases.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientAddNotFoundError'
          example:
            code: not_found
            message: The recipient could not be added.
            details:
              code: recipient_not_found
              request_id: req_01jj0m9w2k3n5p7q9r1s3t5v7w
    RecipientIdempotencyConflict:
      description: |
        The key is bound to a different normalized Recipient-create request within
        its 24-hour window. The outer code is `aborted`, `details.code` is
        `idempotency_conflict` and `details.param` is `Idempotency-Key`.
        The response does not include `details.existing_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HeaderIdempotencyConflict'
    RecipientConflict:
      description: |
        The update conflicts with the Recipient's current state or idempotency state. A resource
        conflict uses outer code `aborted` and `details.code=conflict`; an idempotency conflict uses
        outer code `aborted`, `details.code=idempotency_conflict` and
        `details.param=Idempotency-Key`. UPDATE idempotency conflicts do not include
        `details.existing_id`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/RecipientStateConflictError'
              - $ref: '#/components/schemas/HeaderIdempotencyConflict'
    RecipientRateLimited:
      description: |
        The request exceeded an applicable limit. The outer code is `resource_exhausted`
        and `details.code` is `rate_limited`. Follow `Retry-After` when present.
      headers:
        Retry-After:
          description: Optional non-negative base-10 integer number of seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientRateLimitedError'
    RecipientInternalError:
      description: |
        Pocket could not complete the request. The outer code is `internal` and
        `details.code` is `internal_error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipientInternalError'
    RecipientServiceUnavailable:
      description: |
        Pocket is temporarily unable to complete the request. The outer code is `unavailable`
        and dependency errors use `details.code: dependency_unavailable`.
        Maintenance instead uses `details.maintenance: true` and
        `details.retry_after_seconds`, without a Pocket reason or request ID.
      headers:
        Retry-After:
          description: Optional number of seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            anyOf:
