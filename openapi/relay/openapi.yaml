    RecipientServiceUnavailableDetails:
      type: object
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - dependency_unavailable
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientBadRequestError:
      allOf:
        - $ref: '#/components/schemas/RecipientErrorEnvelope'
        - type: object
          properties:
            code:
              type: string
              enum:
                - invalid_argument
            details:
              $ref: '#/components/schemas/RecipientInvalidRequestDetails'
    RecipientUnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/RecipientErrorEnvelope'
        - type: object
          properties:
            code:
              type: string
              enum:
                - unauthenticated
