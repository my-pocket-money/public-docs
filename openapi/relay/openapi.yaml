        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - not_found
            - recipient_not_found
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientStateConflictDetails:
      type: object
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - conflict
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientRateLimitedDetails:
      type: object
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - rate_limited
        request_id:
          type: string
          minLength: 1
          description: Quote this when contacting support.
    RecipientInternalErrorDetails:
      type: object
      additionalProperties: false
      required:
        - code
        - request_id
      properties:
        code:
          type: string
          enum:
            - internal_error
        request_id:
          type: string
          minLength: 1
